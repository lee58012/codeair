name: codeair
description: "IoT Air Quality Monitoring Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_database: ^11.1.0
  cloud_firestore: ^5.3.0
  firebase_messaging: ^15.1.0

  # UI / Charts
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8

  # Notifications (포그라운드 푸시 표시)
  flutter_local_notifications: ^17.2.3

  # State Management
  provider: ^6.1.2

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# 앱 런처 아이콘 설정 (CodeAir 로고)
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"
