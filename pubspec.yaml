name: codeair
description: "IoT Air Quality Monitoring Dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_database: ^11.1.0
  cloud_firestore: ^5.3.0
  firebase_messaging: ^15.1.0

  # UI / Charts
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
